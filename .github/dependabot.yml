version: 2

# A week is roughly how long a bad publish takes to be noticed and yanked. Cooldown does not
# apply to Dependabot's security updates, so an advisory still arrives the day it is filed.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5

  # Actions are pinned to commit SHAs, so this entry keeps them current. Dependabot rewrites
  # the SHA and its trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
