name: Release

# Pushing a `v*` tag builds every artifact, publishes the release, refreshes the apt
# repository and pushes the crate. `just release <version>` writes that tag.
on:
  push:
    # `*` matches any character but `/`, so a bare "v*" would fire on "vendor-test". The
    # `version` job asserts the exact shape and that it agrees with Cargo.toml.
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build
        required: true
      skip_dependency_age:
        description: Ship even though a dependency is younger than the 7-day floor
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

# One release at a time per tag, never cancelled halfway. `packaging/apt/publish.sh` rewrites
# and signs the apt index in R2, so two concurrent runs of one tag can drop a package.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# The publishing job asks for `contents: write` itself, so jobs that `cargo install`
# third-party build tools hold no token that can push here
permissions:
  contents: read

jobs:
  # Every later job trusts the tag, and crates.io cannot take a publish back
  version:
    name: check the tag
    runs-on: ubuntu-latest
    # The dependency sweep below spaces its requests a second apart over ~270 crates
    timeout-minutes: 25
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: check
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # workflow_dispatch takes the tag as typed and skips the trigger's filter
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$TAG is not a release tag, expected vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          version="${TAG#v}"
          declared=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $TAG says $version but Cargo.toml says $declared"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Every version in the lockfile, because a release ships the whole tree and a tag has no
      # "before" to diff against. A failure blocks the release. Dispatch with
      # skip_dependency_age when a transitive crate is merely young and waiting is worse.
      - name: Dependency age
        if: ${{ !inputs.skip_dependency_age }}
        run: ./.github/check-lockfile-age.py --all

  # The same jobs CI runs on every push to master, so a tag builds nothing new
  artifacts:
    name: artifacts
    needs: version
    uses: ./.github/workflows/artifacts.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  release:
    name: publish the release
    needs: [version, artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \) -exec cp {} release/ \;
          cd release && shasum -a 256 * > sha256sums.txt
      - name: Notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # GITHUB_REF_NAME on workflow_dispatch is the branch, which matches no section
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { printing = 1; next }
            printing && /^## / { exit }
            printing { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
      # The signing key reaches only this check and the step that signs. Never move it to a
      # job-level `env:`, which hands it to every step. A step's `env:` is out of scope for its
      # own `if:`, so this step answers whether a key exists into an output.
      - name: Is a signing key configured
        id: signing
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -n "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # One signature over the checksum file covers every file it names
      - name: Sign the checksums
        if: ${{ steps.signing.outputs.available == 'true' }}
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: ./packaging/release/sign.sh release

      # `sign.sh` self-checks only that the signature is well-formed. This runs the verifier
      # a downloader runs against `allowed_signers`, so a rotated key or a namespace typo
      # fails the release.
      - name: Verify the release the way a downloader does
        if: ${{ steps.signing.outputs.available == 'true' }}
        run: ./packaging/release/verify.sh release

      - name: Say so when a release goes out unsigned
        if: ${{ steps.signing.outputs.available != 'true' }}
        run: |
          echo "::warning::RELEASE_SIGNING_KEY is not set, so this release carries no signature"

      # Added after signing, so the checksums cover neither file. A verifier cannot vouch for
      # itself, and a downloader obtains `allowed_signers` from the repository.
      - name: Include what a verifier needs
        run: cp packaging/release/allowed_signers packaging/release/verify.sh release/

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: release/*
          body_path: notes.md
          generate_release_notes: true

  apt:
    name: refresh the apt repository
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skipped on a fork
    if: ${{ github.repository == 'maninak/radicle-backup' }}
    env:
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'radicle-tools-apt' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: deb-*
          path: incoming
      - name: Install rclone
        if: ${{ env.R2_ENDPOINT != '' && env.APT_GPG_PRIVATE_KEY != '' }}
        run: sudo apt-get update && sudo apt-get install -y rclone apt-utils
      - name: Publish
        if: ${{ env.R2_ENDPOINT != '' && env.APT_GPG_PRIVATE_KEY != '' }}
        run: ./packaging/apt/publish.sh incoming
      # A missing credential warns and passes, because the release's other artifacts went out
      - name: Say so when the apt repository is not refreshed
        if: ${{ env.R2_ENDPOINT == '' || env.APT_GPG_PRIVATE_KEY == '' }}
        run: |
          echo "::warning::apt repository not refreshed: R2_ENDPOINT or APT_GPG_PRIVATE_KEY is not set"

  crate:
    name: publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.repository == 'maninak/radicle-backup' }}
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Publish
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: cargo publish --locked
      # A missing credential warns and passes, because the release's other artifacts went out
      - name: Say so when the crate is not published
        if: ${{ env.CARGO_REGISTRY_TOKEN == '' }}
        run: |
          echo "::warning::crate not published: CARGO_REGISTRY_TOKEN is not set"
