name: Release

# Tagging is the whole trigger. Pushing a `v*` tag builds every artifact, publishes the
# release, refreshes the apt repository and pushes the crate. `just release <version>` writes
# that tag; no version is named here, so this comment cannot go stale against the repository.
on:
  push:
    # `*` matches any character but `/`, so a bare "v*" fires a full release on
    # "vendor-test". These say digits. The exact shape is asserted in the `version` job,
    # because a filter pattern cannot express "and it agrees with Cargo.toml".
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build
        required: true

env:
  CARGO_TERM_COLOR: always

# One release at a time per tag. Not cancel-in-progress: `packaging/apt/publish.sh` reads the
# apt index out of R2, rewrites it and signs it, so two runs of one tag (a push and a
# workflow_dispatch retry, say) can drop a package between them, and killing one halfway is
# worse than making the second wait.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Read by default. The one job that publishes asks for `contents: write` itself, so the jobs
# that `cargo install` third-party build tools are not also holding a token that can push here.
permissions:
  contents: read

jobs:
  # First, because every later job trusts the tag: the binaries carry its version, the release
  # page quotes its changelog section, and crates.io cannot take a publish back.
  version:
    name: check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: check
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Repeated here rather than trusted from the trigger, because workflow_dispatch takes
          # the tag as typed and never passes through that filter at all.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$TAG is not a release tag, expected vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          version="${TAG#v}"
          declared=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $TAG says $version but Cargo.toml says $declared"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  binaries:
    name: ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so one Linux binary runs on every distribution and inside scratch images.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          # Radicle itself does not run on Windows, so this binary is for reading and checking
          # archives there, not for backing up a home that cannot exist.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
          # Cross-built and never executed by CI, because GitHub has no FreeBSD runner. It
          # ships labelled as untested until somebody who runs FreeBSD reports back.
          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
            cross: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      # The line above adds the target to `stable`, but `rust-toolchain.toml` pins the
      # toolchain that actually builds, and rustup says so in its own log: "note that the
      # toolchain '1.96.0-...' is currently in use (overridden by rust-toolchain.toml)". The
      # pinned one had no std for a target that is neither this host nor inside a cross
      # container, so x86_64-apple-darwin failed with "can't find crate for `core`". This adds
      # it where the build will look. A cross target lives in the container, not here.
      - name: Give the pinned toolchain this target
        if: ${{ !matrix.cross }}
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # A pinned release, not git master: an unpinned build tool is a build that changes
      # underneath a tag nobody touched.
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked

      # Every release binary is built the way `just repro` builds one, so a rebuilder gets the
      # bytes the release announced instead of something that merely behaves the same. Inside
      # a cross container the source is already at a fixed path, so only the epoch travels.
      - name: Pin the build to the commit, not to this machine
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          if [ "${{ matrix.cross }}" != "true" ]; then
            printf 'CARGO_ENCODED_RUSTFLAGS=%s\n' \
              "$(printf -- '--remap-path-prefix=%s=/build\x1f--remap-path-prefix=%s=/cargo' \
                 "$PWD" "${CARGO_HOME:-$HOME/.cargo}")" >> "$GITHUB_ENV"
          fi

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      # The same recipe a local build uses, so the names in a tarball, a .deb and a Homebrew
      # formula cannot drift apart. A cross-built binary cannot run here, so this builds a
      # host one to describe itself; the two are the same source at the same commit.
      - name: Man page and completions
        run: just generated

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          name=rad-backup-${{ matrix.target }}
          mkdir -p "dist/$name"
          binary=target/${{ matrix.target }}/release/rad-backup
          [ -f "$binary" ] || binary="$binary.exe"
          cp "$binary" "dist/$name/"
          cp README.md ARCHIVE-FORMAT.md SECURITY.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp -r packaging/generated "dist/$name/generated"
          # Windows gets a .zip, because a .tar.gz there needs a tool the machine may not have.
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd dist && 7z a -bso0 "$name.zip" "$name" > /dev/null)
            artifact="$name.zip"
          else
            tar -czf "dist/$name.tar.gz" -C dist "$name"
            artifact="$name.tar.gz"
          fi
          rm -rf "dist/$name"
          cd dist && sha256sum "$artifact" > "$artifact.sha256" 2>/dev/null \
            || shasum -a 256 "$artifact" > "$artifact.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  packages:
    name: deb (${{ matrix.arch }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: cargo install cargo-deb --version 3.7.0 --locked
      - run: cargo install cross --version 0.2.5 --locked
      - run: sudo apt-get update && sudo apt-get install -y lintian

      # cargo-deb reads SOURCE_DATE_EPOCH for the timestamps inside the archive, so two builds
      # of one tag produce one .deb rather than two that differ only in when they were made.
      - name: Pin the build to the commit, not to this machine
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}

      # cargo-deb reads these from packaging/generated. `just generated` builds a host binary
      # for the purpose, because the cross-built one cannot run here.
      - name: Man page and completions
        run: just generated

      - name: Package
        run: cargo deb --no-build --no-strip --target ${{ matrix.target }}

      - name: Lint
        run: lintian --suppress-tags initial-upload-closes-no-bugs target/${{ matrix.target }}/debian/*.deb

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb-${{ matrix.arch }}
          path: target/${{ matrix.target }}/debian/*.deb

  release:
    name: publish the release
    needs: [version, binaries, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \) -exec cp {} release/ \;
          cd release && shasum -a 256 * > sha256sums.txt
      - name: Notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # From the version job, not GITHUB_REF_NAME, which on workflow_dispatch is the
          # branch the run was started from and would quietly yield no section at all.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { printing = 1; next }
            printing && /^## / { exit }
            printing { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
      # The secret reaches ONLY the step that signs. A step's own `env:` is not in scope for
      # that step's own `if:`, and the fix for that was a job-level `env:`, which handed the
      # signing key to every step in the job including third-party actions. So the question
      # "is there a key" is answered once, into an output, and the key itself travels no
      # further than the one `run:` that needs it.
      - name: Is a signing key configured
        id: signing
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -n "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # Signed here rather than per-artifact: one signature over the checksum file covers
      # every file it names, and it is the file a downloader has to trust anyway.
      - name: Sign the checksums
        if: ${{ steps.signing.outputs.available == 'true' }}
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: ./packaging/release/sign.sh release

      # `sign.sh` self-checks with `-Y check-novalidate`, which proves the signature is
      # well-formed and says nothing about who made it. This runs the verifier a downloader
      # runs, against `allowed_signers`, so a rotated key or a namespace typo fails the
      # release rather than a restore.
      - name: Verify the release the way a downloader does
        if: ${{ steps.signing.outputs.available == 'true' }}
        run: ./packaging/release/verify.sh release

      - name: Say so when a release goes out unsigned
        if: ${{ steps.signing.outputs.available != 'true' }}
        run: |
          echo "::warning::RELEASE_SIGNING_KEY is not set, so this release carries no signature"

      # Deliberately after the checksums are written and signed, and so covered by neither.
      # A verifier cannot vouch for itself, and `allowed_signers` is the key you are supposed
      # to have obtained somewhere other than here. Compare it against the one in the repo.
      - name: Include what a verifier needs
        run: cp packaging/release/allowed_signers packaging/release/verify.sh release/

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: release/*
          body_path: notes.md
          generate_release_notes: true

  apt:
    name: refresh the apt repository
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skipped, harmlessly, on a fork.
    if: ${{ github.repository == 'maninak/radicle-backup' }}
    env:
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'radicle-tools-apt' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: deb-*
          path: incoming
      - name: Install rclone
        if: ${{ env.R2_ENDPOINT != '' && env.APT_GPG_PRIVATE_KEY != '' }}
        run: sudo apt-get update && sudo apt-get install -y rclone apt-utils
      - name: Publish
        if: ${{ env.R2_ENDPOINT != '' && env.APT_GPG_PRIVATE_KEY != '' }}
        run: ./packaging/apt/publish.sh incoming
      # A missing credential is a configuration gap, not a broken release: say which one is
      # missing rather than failing a job whose other artifacts went out fine.
      - name: Say so when the apt repository is not refreshed
        if: ${{ env.R2_ENDPOINT == '' || env.APT_GPG_PRIVATE_KEY == '' }}
        run: |
          echo "::warning::apt repository not refreshed: R2_ENDPOINT or APT_GPG_PRIVATE_KEY is not set"

  crate:
    name: publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.repository == 'maninak/radicle-backup' }}
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Publish
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: cargo publish --locked
      # Same rule as the apt job: a credential nobody has set yet is a configuration gap, and
      # failing the run would say the release broke when every artifact of it went out fine.
      - name: Say so when the crate is not published
        if: ${{ env.CARGO_REGISTRY_TOKEN == '' }}
        run: |
          echo "::warning::crate not published: CARGO_REGISTRY_TOKEN is not set"
