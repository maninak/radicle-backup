name: Release

# Tagging is the whole trigger. `git tag v0.2.0 && git push --tags` builds every artefact,
# publishes the release, refreshes the apt repository and pushes the crate.
on:
  push:
    # `*` matches any character but `/`, so a bare "v*" fires a full release on
    # "vendor-test". These say digits. The exact shape is asserted in the `version` job,
    # because a filter pattern cannot express "and it agrees with Cargo.toml".
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # First, because every later job trusts the tag: the binaries carry its version, the release
  # page quotes its changelog section, and crates.io cannot take a publish back.
  version:
    name: check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: check
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Repeated here rather than trusted from the trigger, because workflow_dispatch takes
          # the tag as typed and never passes through that filter at all.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$TAG is not a release tag, expected vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          version="${TAG#v}"
          declared=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $TAG says $version but Cargo.toml says $declared"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  binaries:
    name: ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so one Linux binary runs on every distribution and inside scratch images.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          # Radicle itself does not run on Windows, so this binary is for reading and checking
          # archives there, not for backing up a home that cannot exist.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
          # Cross-built and never executed by CI, because GitHub has no FreeBSD runner. It
          # ships labelled as untested until somebody who runs FreeBSD reports back.
          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
            cross: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      # A pinned release, not git master: an unpinned build tool is a build that changes
      # underneath a tag nobody touched.
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked

      # Every release binary is built the way `just repro` builds one, so a rebuilder gets the
      # bytes the release announced instead of something that merely behaves the same. Inside
      # a cross container the source is already at a fixed path, so only the epoch travels.
      - name: Pin the build to the commit, not to this machine
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          if [ "${{ matrix.cross }}" != "true" ]; then
            printf 'CARGO_ENCODED_RUSTFLAGS=%s\n' \
              "$(printf -- '--remap-path-prefix=%s=/build\x1f--remap-path-prefix=%s=/cargo' \
                 "$PWD" "${CARGO_HOME:-$HOME/.cargo}")" >> "$GITHUB_ENV"
          fi

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      # The same recipe a local build uses, so the names in a tarball, a .deb and a Homebrew
      # formula cannot drift apart. A cross-built binary cannot run here, so this builds a
      # host one to describe itself; the two are the same source at the same commit.
      - name: Man page and completions
        run: just generated

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          name=rad-backup-${{ matrix.target }}
          mkdir -p "dist/$name"
          binary=target/${{ matrix.target }}/release/rad-backup
          [ -f "$binary" ] || binary="$binary.exe"
          cp "$binary" "dist/$name/"
          cp README.md ARCHIVE-FORMAT.md SECURITY.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp -r packaging/generated "dist/$name/generated"
          # Windows gets a .zip, because a .tar.gz there needs a tool the machine may not have.
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd dist && 7z a -bso0 "$name.zip" "$name" > /dev/null)
            artefact="$name.zip"
          else
            tar -czf "dist/$name.tar.gz" -C dist "$name"
            artefact="$name.tar.gz"
          fi
          rm -rf "dist/$name"
          cd dist && sha256sum "$artefact" > "$artefact.sha256" 2>/dev/null \
            || shasum -a 256 "$artefact" > "$artefact.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  packages:
    name: deb (${{ matrix.arch }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - run: cargo install cargo-deb --locked
      - run: cargo install cross --version 0.2.5 --locked
      - run: sudo apt-get update && sudo apt-get install -y lintian

      # cargo-deb reads SOURCE_DATE_EPOCH for the timestamps inside the archive, so two builds
      # of one tag produce one .deb rather than two that differ only in when they were made.
      - name: Pin the build to the commit, not to this machine
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}

      # cargo-deb reads these from packaging/generated. `just generated` builds a host binary
      # for the purpose, because the cross-built one cannot run here.
      - name: Man page and completions
        run: just generated

      - name: Package
        run: cargo deb --no-build --no-strip --target ${{ matrix.target }}

      - name: Lint
        run: lintian --suppress-tags initial-upload-closes-no-bugs target/${{ matrix.target }}/debian/*.deb

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb-${{ matrix.arch }}
          path: target/${{ matrix.target }}/debian/*.deb

  release:
    name: publish the release
    needs: [version, binaries, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \) -exec cp {} release/ \;
          cd release && shasum -a 256 * > sha256sums.txt
      - name: Notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # From the version job, not GITHUB_REF_NAME, which on workflow_dispatch is the
          # branch the run was started from and would quietly yield no section at all.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { printing = 1; next }
            printing && /^## / { exit }
            printing { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
      # Signed here rather than per-artefact: one signature over the checksum file covers
      # every file it names, and it is the file a downloader has to trust anyway.
      - name: Sign the checksums
        if: ${{ env.RELEASE_SIGNING_KEY != '' }}
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: ./packaging/release/sign.sh release

      - name: Say so when a release goes out unsigned
        if: ${{ env.RELEASE_SIGNING_KEY == '' }}
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          echo "::warning::RELEASE_SIGNING_KEY is not set, so this release carries no signature"

      - name: Include what a verifier needs
        run: cp packaging/release/allowed_signers packaging/release/verify.sh release/

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          body_path: notes.md
          generate_release_notes: true

  apt:
    name: refresh the apt repository
    needs: release
    runs-on: ubuntu-latest
    # Skipped, harmlessly, on a fork.
    if: ${{ github.repository == 'maninak/radicle-backup' }}
    env:
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'radicle-tools-apt' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: deb-*
          path: incoming
      - name: Install rclone
        if: ${{ env.R2_ENDPOINT != '' && env.APT_GPG_PRIVATE_KEY != '' }}
        run: sudo apt-get update && sudo apt-get install -y rclone apt-utils
      - name: Publish
        if: ${{ env.R2_ENDPOINT != '' && env.APT_GPG_PRIVATE_KEY != '' }}
        run: ./packaging/apt/publish.sh incoming
      # A missing credential is a configuration gap, not a broken release: say which one is
      # missing rather than failing a job whose other artefacts went out fine.
      - name: Say so when the apt repository is not refreshed
        if: ${{ env.R2_ENDPOINT == '' || env.APT_GPG_PRIVATE_KEY == '' }}
        run: |
          echo "::warning::apt repository not refreshed: R2_ENDPOINT or APT_GPG_PRIVATE_KEY is not set"

  crate:
    name: publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'maninak/radicle-backup' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
