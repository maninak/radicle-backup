name: Artifacts

# Every binary and package a release ships, built exactly as a release builds them

on:
  workflow_call:
    inputs:
      ref:
        description: The commit, branch or tag to build
        type: string
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so one Linux binary runs on every distribution and inside scratch images
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          # Radicle does not run on Windows, so this binary only reads and checks archives
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
          # Cross-built and never executed, because GitHub has no FreeBSD runner. This binary
          # ships labelled as untested.
          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
            cross: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      # The step above adds the target to `stable`, but `rust-toolchain.toml` pins the
      # toolchain that builds, which fails with "can't find crate for `core`" without this
      # target's std. A cross target lives in the container.
      - name: Give the pinned toolchain this target
        if: ${{ !matrix.cross }}
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # A pinned release, because an unpinned build tool changes the build under an old tag
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked

      # Every release binary is built the way `just repro` builds one, so a rebuilder gets the
      # announced bytes. Inside a cross container the source is already at a fixed path, so
      # only the epoch travels.
      - name: Pin the build to the commit, not to this machine
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          if [ "${{ matrix.cross }}" != "true" ]; then
            printf 'CARGO_ENCODED_RUSTFLAGS=%s\n' \
              "$(printf -- '--remap-path-prefix=%s=/build\x1f--remap-path-prefix=%s=/cargo' \
                 "$PWD" "${CARGO_HOME:-$HOME/.cargo}")" >> "$GITHUB_ENV"
          fi

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      # The same recipe a local build uses, so a tarball, a .deb and a Homebrew formula agree.
      # A cross-built binary cannot run here, so this builds a host one from the same commit.
      - name: Man page and completions
        run: just generated

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          name=rad-backup-${{ matrix.target }}
          mkdir -p "dist/$name"
          binary=target/${{ matrix.target }}/release/rad-backup
          [ -f "$binary" ] || binary="$binary.exe"
          cp "$binary" "dist/$name/"
          cp README.md ARCHIVE-FORMAT.md SECURITY.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          # `packaging/generated/rad-restore` is a symlink that dangles until installed. BSD
          # `cp -r` follows it and fails, and `-R` copies the link on GNU and BSD alike.
          cp -R packaging/generated "dist/$name/generated"
          # Windows gets a .zip, because a .tar.gz there needs a tool the machine may not have
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd dist && 7z a -bso0 "$name.zip" "$name" > /dev/null)
            artifact="$name.zip"
          else
            tar -czf "dist/$name.tar.gz" -C dist "$name"
            artifact="$name.tar.gz"
          fi
          rm -rf "dist/$name"
          cd dist && sha256sum "$artifact" > "$artifact.sha256" 2>/dev/null \
            || shasum -a 256 "$artifact" > "$artifact.sha256"

      # Transport only. `publish the release` re-uploads these to the GitHub Release in the
      # same run. Fourteen days lets a re-run of the apt publish find its input.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          retention-days: 14

  packages:
    name: deb (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: cargo install cargo-deb --version 3.7.0 --locked
      - run: cargo install cross --version 0.2.5 --locked
      - run: sudo apt-get update && sudo apt-get install -y lintian

      # cargo-deb stamps SOURCE_DATE_EPOCH inside the archive, so two builds of one tag produce
      # the same .deb
      - name: Pin the build to the commit, not to this machine
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}

      # cargo-deb reads these from packaging/generated. `just generated` builds a host binary
      # for the purpose, because the cross-built one cannot run here.
      - name: Man page and completions
        run: just generated

      - name: Package
        run: cargo deb --no-build --no-strip --target ${{ matrix.target }}

      - name: Lint
        run: just lint-deb-at target/${{ matrix.target }}/debian

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-${{ matrix.arch }}
          path: target/${{ matrix.target }}/debian/*.deb
          retention-days: 14
