name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # The schedule runs only the advisory job, because an advisory against a shipped release
  # arrives without a push
  schedule:
    - cron: "17 5 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The repository default is a setting that changes without touching this file. Nothing here
# writes.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The restore-script parity test runs the archive's `case` under every shell it finds,
      # and `busybox ash` has its own pattern matcher. The `jq` tests fail on this leg without
      # `jq`, and the runner image may drop it.
      - name: What the shipped script needs
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y busybox jq
      - name: Formatting
        run: cargo fmt --check
      # The justfile runs these same `ci/` scripts. Each reads only tracked text, so one
      # platform gives the answer.
      - name: Audit map
        if: matrix.os == 'ubuntu-latest'
        run: ci/audit-map.sh
      - name: Names
        if: matrix.os == 'ubuntu-latest'
        run: ci/names.sh
      - name: Messages
        if: matrix.os == 'ubuntu-latest'
        run: ci/messages.sh
      - name: Shell
        if: matrix.os == 'ubuntu-latest'
        run: ci/shell.sh
      - name: Pins
        if: matrix.os == 'ubuntu-latest'
        run: ci/pins.sh
      # `--locked` makes a widened Cargo.toml requirement an error. A silent re-resolve would
      # pull a crate the dependency-age gate never sees as added.
      - name: Lints
        run: cargo clippy --all-targets --locked
      # Simulates on linux what the windows job compiles for real
      - name: Non-unix gates
        if: matrix.os == 'ubuntu-latest'
        run: ci/nonunix.sh
      # The integration suite drives the real binary against a real git. Windows runs the path
      # where a file cannot be restricted to one user, and this is that path's only test.
      - name: Tests
        run: cargo test --locked

  msrv:
    name: msrv
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read rust-version
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      # The `master` branch of this action requires `toolchain`, and the `stable` branch
      # defaults it to stable, which would check the release toolchain twice
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml, which otherwise pins every job to the
      # release toolchain and turns this job into a copy of the one above
      - run: cargo check --all-targets
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}

  reproducible:
    name: reproducible build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      # No cache, because a build that reproduces only by reusing the last one proves nothing
      - name: Build it twice and compare
        run: just repro

  nix:
    name: nix build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      # Building twice catches a flake that is reproducible only by accident of caching. Both
      # builds hash the tree (`src = self`), so `--no-link` and an up-front `nix flake lock`
      # keep either build from writing into it.
      #
      # `flake.lock` is not committed. flake.nix pins nixpkgs by revision, so a lock adds only
      # a narHash. Revisit if a second input arrives, or if the flake ever tracks a branch.
      - name: Write the lock file before anything hashes the tree
        run: nix flake lock
      - name: Build
        run: nix build --no-link --print-build-logs
      # `--rebuild` builds the derivation again and fails when the outputs differ. A store path
      # derives from the inputs, so comparing two `result` symlinks would never fail.
      - name: Build again and fail if the output differs
        run: nix build --rebuild --no-link --print-build-logs

  package:
    name: debian package
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: cargo install cargo-deb --version 3.7.0 --locked
      - run: sudo apt-get update && sudo apt-get install -y lintian
      - run: just lint-deb
      # A scratch build to install by hand when trying a packaging change. Nothing downstream
      # reads it, so it expires.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rad-backup-deb
          path: target/debian/*.deb
          retention-days: 14

  audit:
    name: advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The lockfile check reads Cargo.lock from the base commit, absent in a shallow clone
          fetch-depth: 0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # The pins on actions this CI runs, all typed by hand (`just deps` lists the stale ones)
      - name: Action pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/check-action-pins.sh
      # The crates this push or pull request adds, since an existing pin only gets older. With
      # no readable base (a force-push, a new branch) it sweeps every entry, because skipping
      # would pass having examined nothing. The release always runs `--all`.
      - name: Dependency age
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE:Cargo.lock" 2>/dev/null; then
            echo "::notice::no readable base to compare Cargo.lock against, sweeping every entry"
            exec ./.github/check-lockfile-age.py --all
          fi
          ./.github/check-lockfile-age.py --base "$BASE"

  # The release build, on every push to master so it is never older than the last commit. A
  # called workflow does not inherit this file's `env`, so these build without `-D warnings`,
  # and a dependency that starts warning cannot fail a release.
  artifacts:
    name: artifacts
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/artifacts.yml
    with:
      ref: ${{ github.sha }}
