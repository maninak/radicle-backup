name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # For the advisory job alone, below. An advisory is filed against a dependency of a release
  # that already shipped, so waiting for somebody to push is waiting for the wrong event.
  schedule:
    - cron: "17 5 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Stated rather than inherited from the repository default, which is a setting somebody can
# change without touching this file. Nothing here writes.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Formatting
        run: cargo fmt --check
      # `--locked`, so a Cargo.toml requirement widened without updating Cargo.lock is an error
      # rather than a silent re-resolve. Without it the dependency-age gate below sees no added
      # versions while the build pulls and runs a crate published this morning.
      - name: Lints
        run: cargo clippy --all-targets --locked
      # The integration suite drives the real binary against a real git, which is what makes
      # it worth running on every platform rather than only where it was written. Windows is
      # where the "this cannot be restricted to one user" path is the live one, so a green run
      # there is the only evidence that path compiles and behaves.
      - name: Tests
        run: cargo test --locked

  msrv:
    name: msrv
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read rust-version
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      # The `master` branch of this action, not `stable`: they are different action.yml files,
      # and only this one leaves `toolchain` required instead of defaulting it to stable, which
      # is the difference between checking the MSRV and checking the release toolchain twice.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # A claimed MSRV that nothing checks is a claim, not a fact. RUSTUP_TOOLCHAIN overrides
      # rust-toolchain.toml, which otherwise pins every job to the release toolchain and would
      # quietly turn this job into a second copy of the one above it.
      - run: cargo check --all-targets
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}

  reproducible:
    name: reproducible build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      # No cache: a build that only reproduces because it reused the last one proves nothing.
      - name: Build it twice and compare
        run: just repro

  nix:
    name: nix build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      # The nix build is the reference: it is the one anyone can repeat on a machine that
      # shares nothing with this one. Building it twice here catches a flake that is
      # reproducible only by accident of caching.
      #
      # Both builds have to read the SAME tree, and `src = self` means the tree is the source,
      # so anything either build writes into it changes what the next one hashes. Two things
      # did: the `result` symlink, hence `--no-link`, and `flake.lock`, which `nix build`
      # creates when it is absent. That is why `--rebuild` reported a derivation it had never
      # built instead of comparing two. Writing the lock once up front settles the tree before
      # either build looks at it. Revisit when flake.lock is committed, which also removes it.
      - name: Write the lock file before anything hashes the tree
        run: nix flake lock
      - name: Build
        run: nix build --no-link --print-build-logs
      # `--rebuild` IS the comparison: it builds the derivation again and fails with "may not
      # be deterministic" when the outputs differ. Comparing the two `result` symlinks would
      # look like a check and never be one, because a store path is derived from the inputs and
      # is identical across a rebuild whatever bytes came out of it.
      - name: Build again and fail if the output differs
        run: nix build --rebuild --no-link --print-build-logs

  package:
    name: debian package
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: cargo install cargo-deb --version 3.7.0 --locked
      - run: sudo apt-get update && sudo apt-get install -y lintian
      - run: just lint-deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rad-backup-deb
          path: target/debian/*.deb

  audit:
    name: advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the lockfile check below reads Cargo.lock out of the commit this one
          # is built on, which a shallow clone does not have.
          fetch-depth: 0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # The other half of the supply chain: what runs this repo's CI, rather than what it
      # links against. Dependabot's cooldown governs the updates it raises; this governs a
      # pin somebody typed, which is the one written in a hurry.
      - name: Action pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/check-action-pins.sh
      # And the third: what the crate links against. Normally only what this push or pull
      # request ADDS, because a pin that is already here only gets older, and sweeping all 269
      # against a rate-limited API costs five minutes to learn nothing new.
      #
      # When the base cannot be read the fallback is to sweep everything, not to skip. It used
      # to skip, and printed a notice while doing it, so a force-push (or the first push to a
      # branch) turned this into a check that passed having examined nothing. Widening on
      # doubt costs five minutes; narrowing on doubt costs the whole point of the gate. The
      # release runs `--all` unconditionally, because a tag has no "before" at all.
      - name: Dependency age
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE:Cargo.lock" 2>/dev/null; then
            echo "::notice::no readable base to compare Cargo.lock against, sweeping every entry"
            exec ./.github/check-lockfile-age.py --all
          fi
          ./.github/check-lockfile-age.py --base "$BASE"

  # The release path, run before a tag makes it irreversible. Only on master and on demand: a
  # pull request does not need six cross-built targets, and the weekly schedule exists for
  # the advisory job, which reads a database rather than a compiler.
  #
  # This repository is public, so these runners cost nothing. That is the whole reason it can
  # be every push rather than a nightly: the answer to "does the release still build" should
  # never be older than the last commit.
  #
  # A called workflow does not inherit this file's `env`, so these jobs build without
  # `-D warnings`, exactly as they did when they lived in release.yml. That is deliberate: a
  # release must not fail because a dependency started emitting a warning, and `test` already
  # holds the same code to `-D warnings` on three platforms.
  artifacts:
    name: artifacts
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/artifacts.yml
    with:
      ref: ${{ github.sha }}
