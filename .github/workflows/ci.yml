name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets
      # The integration suite drives the real binary against a real git, which is what makes
      # it worth running on every platform rather than only where it was written. Windows is
      # where the "this cannot be restricted to one user" path is the live one, so a green run
      # there is the only evidence that path compiles and behaves.
      - name: Tests
        run: cargo test

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # A claimed MSRV that nothing checks is a claim, not a fact. RUSTUP_TOOLCHAIN overrides
      # rust-toolchain.toml, which otherwise pins every job to the release toolchain and would
      # quietly turn this job into a second copy of the one above it.
      - run: cargo check --all-targets
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}

  reproducible:
    name: reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v2
      # No cache: a build that only reproduces because it reused the last one proves nothing.
      - name: Build it twice and compare
        run: just repro

  nix:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # The nix build is the reference: it is the one anyone can repeat on a machine that
      # shares nothing with this one. Building it twice here catches a flake that is
      # reproducible only by accident of caching.
      - name: Build
        run: nix build --print-build-logs
      - name: Build again and compare
        run: |
          first=$(readlink -f result)
          rm -f result
          nix build --rebuild --print-build-logs
          second=$(readlink -f result)
          echo "$first"
          echo "$second"
          [ "$first" = "$second" ]

  package:
    name: debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: cargo install cargo-deb --locked
      - run: sudo apt-get update && sudo apt-get install -y lintian
      - run: just lint-deb
      - uses: actions/upload-artifact@v4
        with:
          name: rad-backup-deb
          path: target/debian/*.deb

  audit:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
