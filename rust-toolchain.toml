# Pinned, because a reproducible binary is a promise about a toolchain as much as about
# source: two rustc versions optimise differently and produce different bytes from the same
# code. Bump it deliberately, in its own commit, and the release notes will say so.
#
# The MSRV job in CI overrides this with RUSTUP_TOOLCHAIN, so the floor in Cargo.toml
# (`rust-version`) stays checked rather than assumed.
[toolchain]
channel = "1.96.0"
components = ["clippy", "rustfmt"]
