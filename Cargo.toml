[package]
name = "rad-backup"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Back up, restore and migrate a Radicle identity, node state and repositories"
authors = ["Konstantinos Maninakis <info@radicle.tools>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/maninak/radicle-backup"
homepage = "https://radicle.tools"
readme = "README.md"
keywords = ["radicle", "backup", "restore", "git", "identity"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/packaging", "/tests/fixtures"]

[dependencies]
age = { version = "0.12.1", features = ["ssh"] }
bip39 = "2.2.2"
bs58 = "0.5.1"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.6"
clap_mangen = "0.2.32"
hex = "0.4.3"
jiff = "0.2.35"
qrcode = "0.14.1"
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
ssh-key = { version = "0.6.7", features = ["encryption", "ed25519", "getrandom"] }
tar = "0.4.46"
thiserror = "2.0.20"
zeroize = "1.9.0"
zstd = "0.13.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
