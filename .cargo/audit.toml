# Read by the `advisories` CI job and by `cargo audit` locally

[advisories]
# RUSTSEC-2023-0071, a timing sidechannel in `rsa` private-key operations, arrives with the
# `ssh` feature of `age` and has no patched release. The attack times many chosen decryptions.
# The `rsa` code runs only when an ssh-RSA `--identity` opens an archive, once and locally.
#
# Revisit when `rsa` ships a fix (https://github.com/RustCrypto/RSA/issues/626), or when `age`
# takes ssh keys without it.
ignore = ["RUSTSEC-2023-0071"]
